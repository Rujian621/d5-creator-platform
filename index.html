<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第五人格创作者约稿平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .card-hover { transition: all .2s; }
  .card-hover:hover { box-shadow: 0 8px 32px rgba(100,60,180,.15); transform: translateY(-3px); }
  .identity-card { border:2px solid #f0f0f0;border-radius:20px;padding:32px 24px;cursor:pointer;transition:all .2s;background:white; }
  .identity-card:hover { border-color:#6c3eb8; }
  .btn-primary { background:#6c3eb8;color:white;border-radius:10px;padding:10px 24px;font-weight:600;cursor:pointer;transition:background .2s;border:none; }
  .btn-primary:hover { background:#5a2ea0; }
  .btn-secondary { background:#f3f4f6;color:#374151;border-radius:10px;padding:10px 24px;font-weight:600;cursor:pointer;border:none; }
  .btn-secondary:hover { background:#e5e7eb; }
  input[type=text],input[type=url],input[type=password] {
    border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 14px;width:100%;outline:none;transition:border .2s;font-size:14px;
  }
  input:focus { border-color:#6c3eb8; }
  .modal-backdrop { background:rgba(0,0,0,.45); }
</style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-white to-indigo-50 min-h-screen">

<div class="bg-white shadow-sm">
  <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
    <span class="text-2xl">🎮</span>
    <span class="font-bold text-gray-800 text-lg">第五人格 · 创作者约稿平台</span>
  </div>
</div>

<div class="max-w-2xl mx-auto mt-16 px-4 pb-16">
  <div class="text-center mb-10">
    <div class="text-5xl mb-4">🎯</div>
    <h2 class="text-3xl font-bold text-gray-800 mb-2">请选择你的身份</h2>
    <p class="text-gray-400 text-sm">选择后进入对应功能页面</p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-lg mx-auto">

    <!-- 运营后台 -->
    <div class="identity-card card-hover" onclick="handleAdmin()">
      <div class="text-4xl mb-3">🎛️</div>
      <div class="font-bold text-gray-800 text-lg mb-1">运营后台</div>
      <div class="text-sm text-gray-500 leading-relaxed">发布任务 · 审核报名<br>审核返链 · 导出数据</div>
      <div class="mt-3 text-xs text-gray-400 flex items-center gap-1">🔐 需要密码</div>
    </div>

    <!-- 创作者 -->
    <div class="identity-card card-hover" onclick="handleCreator()">
      <div class="text-4xl mb-3">✍️</div>
      <div class="font-bold text-gray-800 text-lg mb-1">创作者</div>
      <div class="text-sm text-gray-500 leading-relaxed">浏览任务 · 报名参与<br>提交返链 · 查看审核</div>
      <div class="mt-3 text-xs text-purple-500 font-medium">博主 / 主播</div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed top-4 right-4 text-white px-5 py-3 rounded-xl text-sm shadow-xl z-[9999] opacity-0 transition-opacity duration-300 pointer-events-none" style="background:#1f2937"></div>

<!-- Admin Password Modal -->
<div id="adminPwdModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl p-8 w-[360px] shadow-xl">
    <div class="text-3xl mb-3 text-center">🎛️</div>
    <h3 class="text-xl font-bold text-gray-800 text-center mb-1">运营后台</h3>
    <p class="text-gray-400 text-sm text-center mb-5">请输入访问密码</p>
    <input type="password" id="adminPwdInput" placeholder="请输入密码" class="mb-4" />
    <div class="flex gap-3">
      <button class="btn-secondary flex-1" onclick="closeAdminPwd()">取消</button>
      <button class="btn-primary flex-1" onclick="verifyAdminPwd()">进入</button>
    </div>
  </div>
</div>

<!-- Creator Info Modal -->
<div id="creatorModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl p-8 w-[420px] shadow-xl max-h-[90vh] overflow-y-auto">
    <div class="text-2xl mb-2">✍️</div>
    <h3 class="text-xl font-bold text-gray-800 mb-1">创作者信息</h3>
    <p class="text-gray-400 text-sm mb-5">填写后即可浏览任务、报名参与</p>
    <div class="space-y-4 mb-5">
      <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">昵称 <span class="text-red-500">*</span></label>
        <input type="text" id="cr_name" placeholder="你的昵称" /></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">微信号 <span class="text-red-500">*</span></label>
        <input type="text" id="cr_wechat" placeholder="用于联系" /></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">创作者类型 <span class="text-red-500">*</span></label>
        <select id="cr_type" class="border border-gray-200 rounded-lg px-3 py-2.5 w-full text-sm focus:border-purple-500 outline-none">
          <option value="博主">博主（图文/视频）</option>
          <option value="主播">主播（直播）</option>
        </select></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">小红书主页链接 <span class="text-red-500">*</span></label>
        <input type="url" id="cr_profile" placeholder="https://www.xiaohongshu.com/user/profile/..." /></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">实时粉丝数 <span class="text-red-500">*</span></label>
        <input type="text" id="cr_fans" placeholder="例如：12万、8500" /></div>
    </div>
    <div class="flex gap-3">
      <button class="btn-secondary flex-1" onclick="closeModal('creatorModal')">取消</button>
      <button class="btn-primary flex-1" onclick="saveCreator()">进入平台</button>
    </div>
  </div>
</div>

<script>
// Load config
const CONFIG = (() => {
  try { return PLATFORM_CONFIG || {}; } catch(e) { return {}; }
})();

const ADMIN_PWD = CONFIG.adminPassword || 'xhsrj2026';
const DB_KEY = CONFIG.storageKey || 'd5_creator_platform_v1';

// Seed demo data
(function() {
  const raw = localStorage.getItem(DB_KEY);
  const db = raw ? JSON.parse(raw) : {};
  if (db.tasks && db.tasks.length) return;
  const d = { tasks: [], signups: [], contents: [], _version: 0 };
  d.tasks.push({
    id: 'demo1',
    gameName: '第五人格',
    gameType: '非对称对抗竞技手游',
    highlight: '悬疑推理·非对称对抗',
    gameLink: 'https://game.dwqy.netease.com/',
    desc: '《第五人格》是由网易互娱在线开发的非对称性对抗竞技类手机游戏，悬疑怪诞的画风，刺激的追逐对抗。',
    req: '笔记需包含至少50%以上的游戏实机画面，时长>30秒，文案和素材需自行剪辑与配音。',
    reward: '根据粉丝量级和笔记质量结算报酬',
    launchDate: '2026年5月15日',
    releaseTime: '2026年5月15日中午12点后',
    deadline: '2026-06-15',
    creatorType: '不限',
    maxSignup: 50,
    status: 'active',
    createdAt: Date.now()
  });
  localStorage.setItem(DB_KEY, JSON.stringify(d));
})();

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2500);
}
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

// ---- Admin ----
function handleAdmin() {
  if (sessionStorage.getItem('admin_unlocked') === '1') {
    window.location.href = 'admin.html';
    return;
  }
  document.getElementById('adminPwdInput').value = '';
  document.getElementById('adminPwdModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('adminPwdInput').focus(), 100);
}
function closeAdminPwd() { closeModal('adminPwdModal'); }
function verifyAdminPwd() {
  if (document.getElementById('adminPwdInput').value.trim() === ADMIN_PWD) {
    sessionStorage.setItem('admin_unlocked', '1');
    window.location.href = 'admin.html';
  } else {
    showToast('密码错误 ❌');
  }
}
document.getElementById('adminPwdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') verifyAdminPwd();
});

// ---- Creator ----
function handleCreator() {
  const name = localStorage.getItem('cr_name');
  if (name) {
    window.location.href = 'creator.html';
    return;
  }
  document.getElementById('cr_name').value = '';
  document.getElementById('cr_wechat').value = '';
  document.getElementById('cr_profile').value = '';
  document.getElementById('cr_fans').value = '';
  document.getElementById('creatorModal').classList.remove('hidden');
}
function saveCreator() {
  const name = document.getElementById('cr_name').value.trim();
  const wechat = document.getElementById('cr_wechat').value.trim();
  const type = document.getElementById('cr_type').value;
  const profile = document.getElementById('cr_profile').value.trim();
  const fans = document.getElementById('cr_fans').value.trim();
  if (!name) { showToast('请输入昵称'); return; }
  if (!wechat) { showToast('请填写微信号'); return; }
  if (!profile) { showToast('请填写主页链接'); return; }
  if (!fans) { showToast('请填写粉丝数'); return; }
  localStorage.setItem('cr_name', name);
  localStorage.setItem('cr_wechat', wechat);
  localStorage.setItem('cr_type', type);
  localStorage.setItem('cr_profile', profile);
  localStorage.setItem('cr_fans', fans);
  window.location.href = 'creator.html';
}
</script>
</body>
</html>
