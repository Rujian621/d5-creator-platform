<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营后台 · 第五人格创作者约稿平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="api.js"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  .btn-primary { background:#6c3eb8;color:white;border-radius:10px;padding:8px 20px;font-weight:600;cursor:pointer;border:none;font-size:14px; }
  .btn-primary:hover { background:#5a2ea0; }
  .btn-secondary { background:#f3f4f6;color:#374151;border-radius:10px;padding:8px 20px;font-weight:600;cursor:pointer;border:none;font-size:14px; }
  .btn-secondary:hover { background:#e5e7eb; }
  .btn-success { background:#10b981;color:white;border-radius:10px;padding:8px 20px;font-weight:600;cursor:pointer;border:none;font-size:14px; }
  .btn-success:hover { background:#059669; }
  .btn-danger { background:#ef4444;color:white;border-radius:10px;padding:8px 20px;font-weight:600;cursor:pointer;border:none;font-size:14px; }
  .btn-danger:hover { background:#dc2626; }
  .btn-sm { padding:5px 14px;font-size:13px;border-radius:8px; }
  input[type=text],input[type=url],input[type=number],input[type=date],textarea,select {
    border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 14px;width:100%;outline:none;transition:border .2s;font-size:14px;
  }
  input:focus,textarea:focus,select:focus { border-color:#6c3eb8; }
  textarea { min-height:80px;resize:vertical; }
  .modal-backdrop { background:rgba(0,0,0,.45); }
  .tab-active { border-bottom:3px solid #6c3eb8;color:#6c3eb8;font-weight:600; }
  .status-badge { display:inline-block;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600; }
  .badge-pending { background:#fef3c7;color:#92400e; }
  .badge-approved { background:#d1fae5;color:#065f46; }
  .badge-rejected { background:#fee2e2;color:#991b1b; }
  .badge-active { background:#dbeafe;color:#1e40af; }
  .badge-ended { background:#e5e7eb;color:#6b7280; }
  .copy-btn { cursor:pointer;color:#6c3eb8;font-size:12px;margin-left:6px; }
  .copy-btn:hover { text-decoration:underline; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">

<div class="bg-white shadow-sm sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html" class="text-gray-400 hover:text-gray-600">← 返回</a>
      <span class="text-gray-200">|</span>
      <span class="font-bold text-gray-800">🎛️ 运营后台</span>
    </div>
    <div class="flex items-center gap-2">
      <select id="exportTaskSelect" class="!py-1.5 !px-3 text-sm" style="min-width:140px"><option value="">全部任务</option></select>
      <button class="btn-secondary btn-sm" onclick="exportSelected()">📋 导出报表</button>
    </div>
  </div>
</div>

<div class="bg-white border-b">
  <div class="max-w-7xl mx-auto px-4 flex gap-6">
    <button class="py-3 text-sm tab-active" data-tab="tasks" onclick="switchTab('tasks')">📋 任务管理</button>
    <button class="py-3 text-sm text-gray-500 hover:text-gray-700" data-tab="contents" onclick="switchTab('contents')">🔗 返链审核</button>
    <button class="py-3 text-sm text-gray-500 hover:text-gray-700" data-tab="users" onclick="switchTab('users')">👥 创作者管理</button>
  </div>
</div>

<div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-70 flex items-center justify-center z-50 hidden">
  <div class="text-lg text-gray-600">加载中...</div>
</div>

<div class="max-w-7xl mx-auto px-4 py-6">
  <!-- 任务管理 -->
  <div id="tab-tasks">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-gray-800">任务列表</h2>
      <button class="btn-primary" onclick="showTaskModal()">➕ 发布任务</button>
    </div>
    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500">
          <tr><th class="px-4 py-3 text-left">任务名称</th><th class="px-4 py-3 text-center">报名数</th><th class="px-4 py-3 text-left">截止</th><th class="px-4 py-3 text-center">状态</th><th class="px-4 py-3 text-center">操作</th></tr>
        </thead>
        <tbody id="taskTableBody"><tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 返链审核 -->
  <div id="tab-contents" class="hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-gray-800">返链审核</h2>
      <div class="flex gap-2">
        <select id="contentTaskFilter" class="!py-2 !px-3 text-sm" onchange="renderContents()"><option value="">全部任务</option></select>
        <select id="contentStatusFilter" class="!py-2 !px-3 text-sm" onchange="renderContents()">
          <option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已拒绝</option>
        </select>
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500">
          <tr><th class="px-4 py-3 text-left">任务</th><th class="px-4 py-3 text-left">昵称</th><th class="px-4 py-3 text-left">主页</th><th class="px-4 py-3 text-left">笔记链接</th><th class="px-4 py-3 text-left">提交时间</th><th class="px-4 py-3 text-center">状态</th><th class="px-4 py-3 text-center">操作</th></tr>
        </thead>
        <tbody id="contentTableBody"><tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 创作者管理 -->
  <div id="tab-users" class="hidden">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-lg font-bold text-gray-800">创作者列表</h2>
      <div class="flex gap-2 items-center">
        <input type="text" id="userSearch" placeholder="搜索用户名..." class="!py-1.5 !px-3 text-sm !w-48" oninput="renderUsers()" />
      </div>
    </div>
    <div class="bg-white rounded-2xl shadow overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-500">
          <tr><th class="px-4 py-3 text-left">用户名</th><th class="px-4 py-3 text-left">密码</th><th class="px-4 py-3 text-center">报名数</th><th class="px-4 py-3 text-left">注册时间</th><th class="px-4 py-3 text-center">操作</th></tr>
        </thead>
        <tbody id="userTableBody"><tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">加载中...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Task Modal -->
<div id="taskModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl p-6 w-[520px] shadow-xl max-h-[90vh] overflow-y-auto">
    <h3 class="text-lg font-bold text-gray-800 mb-4" id="taskModalTitle">📝 发布推广任务</h3>
    <div class="space-y-3">
      <div><label class="block text-xs font-semibold text-gray-500 mb-1">任务名称 <span class="text-red-500">*</span></label>
        <input type="text" id="t_name" placeholder="例如：第五人格夏日活动" /></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1">任务奖励</label>
        <input type="text" id="t_reward" placeholder="例如：根据粉丝量级结算报酬" /></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1">任务描述</label>
        <textarea id="t_desc" placeholder="任务说明、注意事项等"></textarea></div>
      <div><label class="block text-xs font-semibold text-gray-500 mb-1">内容要求</label>
        <textarea id="t_req" placeholder="例如：笔记需包含至少50%游戏实机画面..."></textarea></div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-semibold text-gray-500 mb-1">内容释出时间</label>
          <input type="text" id="t_launchDate" placeholder="例如：5月15日中午12点后" /></div>
        <div><label class="block text-xs font-semibold text-gray-500 mb-1">提交截止 <span class="text-red-500">*</span></label>
          <input type="date" id="t_deadline" /></div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block text-xs font-semibold text-gray-500 mb-1">名额上限</label>
          <input type="number" id="t_maxSignup" placeholder="留空不限" /></div>
        <div><label class="block text-xs font-semibold text-gray-500 mb-1">任务状态</label>
          <select id="t_status"><option value="active">进行中</option><option value="ended">已结束</option></select></div>
      </div>
    </div>
    <input type="hidden" id="t_editId" value="" />
    <div class="flex gap-3 mt-5">
      <button class="btn-secondary flex-1" onclick="closeTaskModal()">取消</button>
      <button class="btn-primary flex-1" onclick="saveTask()">发布</button>
    </div>
  </div>
</div>

<!-- View Detail Modal -->
<div id="viewDetailModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl p-6 w-[480px] shadow-xl">
    <h3 class="text-lg font-bold text-gray-800 mb-4">📄 返链详情</h3>
    <div id="detailContent" class="space-y-2 text-sm mb-4"></div>
    <div class="flex gap-3" id="detailActionBtns"></div>
  </div>
</div>

<!-- Reset Password Modal -->
<div id="resetPwdModal" class="fixed inset-0 modal-backdrop flex items-center justify-center z-50 hidden">
  <div class="bg-white rounded-2xl p-6 w-[400px] shadow-xl">
    <h3 class="text-lg font-bold text-gray-800 mb-4">🔑 重置密码</h3>
    <p class="text-sm text-gray-500 mb-3">用户：<b id="resetPwdUser"></b></p>
    <div class="mb-4">
      <label class="block text-xs font-semibold text-gray-500 mb-1">新密码</label>
      <input type="text" id="resetPwdInput" placeholder="输入新密码（至少6位）" />
    </div>
    <div class="flex gap-3">
      <button class="btn-secondary flex-1" onclick="closeModal('resetPwdModal')">取消</button>
      <button class="btn-primary flex-1" onclick="doResetPwd()">确认重置</button>
    </div>
  </div>
</div>

<div id="toast" class="fixed top-4 right-4 text-white px-5 py-3 rounded-xl text-sm shadow-xl z-[9999] opacity-0 transition-opacity duration-300 pointer-events-none" style="background:#1f2937"></div>

<script>
const ADMIN_PWD = 'xhsrj2026';
if (sessionStorage.getItem('admin_unlocked') !== '1') { window.location.href = 'index.html'; }

let db = { tasks: [], signups: [], users: [], _version: 0 };

function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }

async function loadData() {
  showLoading();
  try {
    const data = await getDB();
    db.tasks = data.tasks || [];
    db.signups = data.signups || [];
    db.users = data.users || [];
    db._version = data._version || 0;
  } catch (e) {
    showToast('加载数据失败: ' + e.message);
  }
  hideLoading();
  refreshAll();
}

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function switchTab(tab) {
  document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
  document.getElementById('tab-' + tab).classList.remove('hidden');
  document.querySelectorAll('[data-tab]').forEach(el => { el.classList.remove('tab-active'); el.classList.add('text-gray-500'); });
  const btn = document.querySelector(`[data-tab="${tab}"]`);
  btn.classList.add('tab-active'); btn.classList.remove('text-gray-500');
}

// ---- 解码密码 ----
function decodePwd(encoded) {
  try { return atob(encoded); } catch { return encoded; }
}

// ---- Tasks ----
function showTaskModal(editId) {
  document.getElementById('taskModal').classList.remove('hidden');
  if (editId) {
    const t = db.tasks.find(x => x.id === editId); if (!t) return;
    document.getElementById('taskModalTitle').textContent = '✏️ 编辑任务';
    document.getElementById('t_editId').value = editId;
    document.getElementById('t_name').value = t.name || '';
    document.getElementById('t_reward').value = t.reward || '';
    document.getElementById('t_desc').value = t.desc || '';
    document.getElementById('t_req').value = t.req || '';
    document.getElementById('t_launchDate').value = t.launchDate || '';
    document.getElementById('t_deadline').value = t.deadline || '';
    document.getElementById('t_maxSignup').value = t.maxSignup || '';
    document.getElementById('t_status').value = t.status || 'active';
  } else {
    document.getElementById('taskModalTitle').textContent = '📝 发布推广任务';
    document.getElementById('t_editId').value = '';
    ['t_name','t_reward','t_desc','t_req','t_launchDate','t_deadline'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('t_maxSignup').value = '';
    document.getElementById('t_status').value = 'active';
  }
}
function closeTaskModal() { document.getElementById('taskModal').classList.add('hidden'); }

async function saveTask() {
  const name = document.getElementById('t_name').value.trim();
  const deadline = document.getElementById('t_deadline').value.trim();
  if (!name) { showToast('请填写任务名称'); return; }
  if (!deadline) { showToast('请填写截止日期'); return; }
  const editId = document.getElementById('t_editId').value;
  const data = {
    name,
    reward: document.getElementById('t_reward').value.trim(),
    desc: document.getElementById('t_desc').value.trim(),
    req: document.getElementById('t_req').value.trim(),
    launchDate: document.getElementById('t_launchDate').value.trim(),
    deadline,
    maxSignup: document.getElementById('t_maxSignup').value,
    status: document.getElementById('t_status').value,
  };
  showLoading();
  try {
    if (editId) {
      data.id = editId;
      await updateTask(data);
    } else {
      data.id = genId();
      data.createdAt = Date.now();
      await createTask(data);
    }
    closeTaskModal();
    showToast(editId ? '任务已更新 ✅' : '任务已发布 🚀');
    await loadData();
  } catch (e) {
    showToast('操作失败: ' + e.message);
    hideLoading();
  }
}

async function handleDeleteTask(id) {
  if (!confirm('确定删除？关联数据也会被删除。')) return;
  showLoading();
  try {
    await deleteTask(id);
    showToast('任务已删除');
    await loadData();
  } catch (e) {
    showToast('删除失败: ' + e.message);
    hideLoading();
  }
}

function renderTasks() {
  const tbody = document.getElementById('taskTableBody');
  if (!db.tasks.length) { tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">暂无任务</td></tr>'; return; }
  tbody.innerHTML = db.tasks.map(t => {
    const cnt = db.signups.filter(s => s.taskId === t.id).length;
    const badge = t.status === 'active' ? '<span class="status-badge badge-active">进行中</span>' : '<span class="status-badge badge-ended">已结束</span>';
    return `<tr class="border-t border-gray-50 hover:bg-gray-50">
      <td class="px-4 py-3 font-medium">${esc(t.name)}</td>
      <td class="px-4 py-3 text-center">${cnt}</td>
      <td class="px-4 py-3 text-gray-500">${t.deadline || '-'}</td>
      <td class="px-4 py-3 text-center">${badge}</td>
      <td class="px-4 py-3 text-center">
        <button class="btn-secondary btn-sm mr-1" onclick="showTaskModal('${t.id}')">编辑</button>
        <button class="btn-danger btn-sm" onclick="handleDeleteTask('${t.id}')">删除</button>
      </td>
    </tr>`;
  }).join('');
}

// ---- Contents ----
function renderContents() {
  const tf = document.getElementById('contentTaskFilter').value;
  const sf = document.getElementById('contentStatusFilter').value;
  let list = db.signups.filter(s => s.contentLink);
  if (tf) list = list.filter(s => s.taskId === tf);
  if (sf) list = list.filter(s => s.contentStatus === sf);
  list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  const tbody = document.getElementById('contentTableBody');
  if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">暂无返链</td></tr>'; return; }
  tbody.innerHTML = list.map(s => {
    const badge = s.contentStatus === 'pending' ? '<span class="status-badge badge-pending">待审核</span>'
      : s.contentStatus === 'approved' ? '<span class="status-badge badge-approved">已通过</span>'
      : '<span class="status-badge badge-rejected">已拒绝</span>';
    return `<tr class="border-t border-gray-50 hover:bg-gray-50">
      <td class="px-4 py-3 font-medium">${esc(s.taskName || '-')}</td>
      <td class="px-4 py-3">${esc(s.creatorName)}</td>
      <td class="px-4 py-3"><a href="${esc(s.creatorProfile || '#')}" target="_blank" class="text-purple-600 hover:underline text-xs">查看</a></td>
      <td class="px-4 py-3"><a href="${esc(s.contentLink)}" target="_blank" class="text-purple-600 hover:underline text-xs break-all">${esc(s.contentLink)}</a></td>
      <td class="px-4 py-3 text-gray-500">${s.createdAt ? new Date(s.createdAt).toLocaleDateString('zh-CN') : '-'}</td>
      <td class="px-4 py-3 text-center">${badge}</td>
      <td class="px-4 py-3 text-center">
        ${s.contentStatus === 'pending' ? `
          <button class="btn-success btn-sm mr-1" onclick="reviewContent('${s.id}','approved')">✅</button>
          <button class="btn-danger btn-sm" onclick="reviewContent('${s.id}','rejected')">❌</button>
        ` : `<button class="btn-secondary btn-sm" onclick="viewDetail('${s.id}')">查看</button>`}
      </td>
    </tr>`;
  }).join('');
}

async function reviewContent(id, status) {
  const s = db.signups.find(x => x.id === id); if (!s) return;
  s.contentStatus = status;
  showLoading();
  try {
    await updateSignup(s);
    showToast(status === 'approved' ? '已通过 ✅' : '已拒绝 ❌');
    await loadData();
  } catch (e) {
    showToast('操作失败: ' + e.message);
    hideLoading();
  }
}

function viewDetail(id) {
  const s = db.signups.find(x => x.id === id); if (!s) return;
  document.getElementById('detailContent').innerHTML = `
    <p><b>任务：</b>${esc(s.taskName || '-')}</p>
    <p><b>昵称：</b>${esc(s.creatorName)}</p>
    <p><b>主页：</b><a href="${esc(s.creatorProfile || '#')}" target="_blank" class="text-purple-600 hover:underline">${esc(s.creatorProfile || '-')}</a></p>
    <p><b>笔记链接：</b><a href="${esc(s.contentLink)}" target="_blank" class="text-purple-600 hover:underline">${esc(s.contentLink)}</a></p>
    <p><b>状态：</b>${s.contentStatus === 'approved' ? '✅ 已通过' : s.contentStatus === 'rejected' ? '❌ 已拒绝' : '⏳ 待审核'}</p>
  `;
  document.getElementById('detailActionBtns').innerHTML = `
    <button class="btn-secondary flex-1" onclick="closeModal('viewDetailModal')">关闭</button>
    ${s.contentStatus === 'pending' ? `<button class="btn-success flex-1" onclick="reviewContent('${s.id}','approved');closeModal('viewDetailModal')">通过</button>
    <button class="btn-danger flex-1" onclick="reviewContent('${s.id}','rejected');closeModal('viewDetailModal')">拒绝</button>` : ''}
  `;
  document.getElementById('viewDetailModal').classList.remove('hidden');
}

function populateFilters() {
  const sel = document.getElementById('contentTaskFilter'); const cur = sel.value;
  sel.innerHTML = '<option value="">全部任务</option>';
  db.tasks.forEach(t => { sel.innerHTML += `<option value="${t.id}" ${t.id === cur ? 'selected' : ''}>${esc(t.name)}</option>`; });
}

function populateExportFilter() {
  const sel = document.getElementById('exportTaskSelect'); const cur = sel.value;
  sel.innerHTML = '<option value="">全部任务</option>';
  db.tasks.forEach(t => { sel.innerHTML += `<option value="${t.id}" ${t.id === cur ? 'selected' : ''}>${esc(t.name)}</option>`; });
}

function exportSelected() {
  const tf = document.getElementById('exportTaskSelect').value;
  let list = db.signups;
  if (tf) list = list.filter(s => s.taskId === tf);
  if (!list.length) { showToast('没有可导出的数据'); return; }
  const taskName = tf ? (db.tasks.find(t => t.id === tf)?.name || '未知任务') : '全部任务';
  let csv = '任务,昵称,主页,笔记链接,状态,提交时间\n';
  list.forEach(s => {
    csv += [`"${s.taskName || ''}"`, `"${s.creatorName || ''}"`, `"${s.creatorProfile || ''}"`, `"${s.contentLink || ''}"`,
      s.contentStatus === 'approved' ? '通过' : s.contentStatus === 'rejected' ? '拒绝' : '待审核',
      s.createdAt ? new Date(s.createdAt).toLocaleString('zh-CN') : ''
    ].join(',') + '\n';
  });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `约稿数据_${taskName}_${new Date().toISOString().slice(0, 10)}.csv`; a.click();
  showToast(`已导出 ${list.length} 条记录 📋`);
}

// ---- Users ----
let resetPwdTarget = '';
function renderUsers() {
  const keyword = (document.getElementById('userSearch')?.value || '').toLowerCase();
  const tbody = document.getElementById('userTableBody');
  let users = db.users || [];
  if (keyword) users = users.filter(u => u.username.toLowerCase().includes(keyword));
  users.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

  if (!users.length) { tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-8 text-center text-gray-400">暂无创作者</td></tr>'; return; }
  tbody.innerHTML = users.map(u => {
    const pwd = decodePwd(u.password);
    const cnt = db.signups.filter(s => s.creatorUsername === u.username).length;
    const regTime = u.createdAt ? new Date(u.createdAt).toLocaleString('zh-CN') : '-';
    return `<tr class="border-t border-gray-50 hover:bg-gray-50">
      <td class="px-4 py-3 font-medium">${esc(u.username)}</td>
      <td class="px-4 py-3">
        <span class="font-mono bg-gray-100 px-2 py-1 rounded text-xs">${esc(pwd)}</span>
        <span class="copy-btn" onclick="copyText('${esc(pwd)}')">复制</span>
      </td>
      <td class="px-4 py-3 text-center">${cnt}</td>
      <td class="px-4 py-3 text-gray-500 text-xs">${regTime}</td>
      <td class="px-4 py-3 text-center">
        <button class="btn-secondary btn-sm" onclick="showResetPwd('${esc(u.username)}')">重置密码</button>
      </td>
    </tr>`;
  }).join('');
}

function showResetPwd(username) {
  resetPwdTarget = username;
  document.getElementById('resetPwdUser').textContent = username;
  document.getElementById('resetPwdInput').value = '';
  document.getElementById('resetPwdModal').classList.remove('hidden');
}

async function doResetPwd() {
  const newPwd = document.getElementById('resetPwdInput').value.trim();
  if (!newPwd || newPwd.length < 6) { showToast('密码至少6位'); return; }
  showLoading();
  try {
    await resetUserPassword(resetPwdTarget, newPwd);
    closeModal('resetPwdModal');
    showToast(`用户 ${resetPwdTarget} 密码已重置 ✅`);
    await loadData();
  } catch (e) {
    showToast('重置失败: ' + e.message);
    hideLoading();
  }
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast('已复制: ' + text));
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; setTimeout(() => { t.style.opacity = '0'; }, 2500); }

function refreshAll() { renderTasks(); populateFilters(); populateExportFilter(); renderContents(); renderUsers(); }
loadData();
</script>
</body>
</html>
